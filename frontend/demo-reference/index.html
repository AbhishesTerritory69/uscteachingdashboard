<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science Teaching Allocation Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-title">Science</div>
          <div class="brand-subtitle">Teaching Allocation</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>▦</span> Dashboard</button>
        <div class="nav-label">TEACHING</div>
        <button class="nav-item" data-view="courses"><span>▤</span> Courses</button>
        <button class="nav-item" data-view="staff"><span>♙</span> Staff</button>
        <button class="nav-item" data-view="allstaff"><span>▥</span> All Staff</button>
        <div class="nav-label">DATA</div>
        <button class="nav-item" data-view="imports"><span>⇧</span> Import Data</button>
        <button class="nav-item" data-view="sources"><span>⌁</span> Data Sources</button>
      </nav>
      <div class="sidebar-footer">
        <div class="status-dot"></div>
        <div>
          <strong>Prototype</strong>
          <small>Science Discipline · SSTE</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">School of Science, Technology and Engineering</div>
          <h1 id="pageTitle">Teaching Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <select id="periodSelect" class="select"><option>2026 Trimester 2</option></select>
          <button class="icon-btn" title="Notifications">🔔</button>
          <div class="avatar">SG</div>
        </div>
      </header>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
